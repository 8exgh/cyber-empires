[package]
name = "cyber-empires"
version = "0.1.0"
edition = "2021"
description = "A Rust/WebAssembly re-implementation of the 1992 strategy game Cyber Empires"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ce-tool"
path = "tools/ce_tool.rs"
required-features = ["native"]

[features]
default = []
native = []

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

[profile.dev]
opt-level = 1
