server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    types {
        application/wasm wasm;
        text/html html;
        text/css css;
        application/javascript js;
        text/plain txt;
        image/gif gif;
        application/octet-stream map dat iat bin mus;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "cyber-empires ok\n";
    }

    # The page files change with every release; make browsers and the Cloudflare
    # edge revalidate them (ETag) instead of caching them for hours.
    location ~* \.(wasm|html|js|css|txt)$ {
        add_header Cache-Control "no-cache";
    }

    location /game/ {
        # optional game data mounted by the host; never indexed
        autoindex off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
